[project]
name = "minimi"
version = "0.1.0"
description = "Lightweight conversational agent with temporal memory and cross-session question recall"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vedant Gupta", email = "guptavedant847@gmail.com" }
]
dependencies = [
    "litellm>=1.43.0",
    "tavily-python>=0.3.5",
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]

[project.scripts]
minimi = "minimi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minimi"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
